<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sổ Nợ</title>
<style>
:root{
  --bg:#f6f8fd; --card:#fff; --line:#e6ebf4; --line2:#eef2f8; --text:#18253d; --muted:#7f8ba1;
  --blue:#157cf3; --blue2:#0b6ee9; --blueSoft:#edf5ff; --green:#1aa36c; --greenSoft:#eaf8f1;
  --red:#e05a68; --redSoft:#fff1f3; --orange:#b87b23; --orangeSoft:#fff7ee; --shadow:0 4px 18px rgba(30,70,140,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text)}
body{overflow:hidden}
button,input{font:inherit}
button{cursor:pointer;border:none;background:none}
.app{height:100dvh;max-width:900px;margin:0 auto;padding:18px 14px calc(env(safe-area-inset-bottom) + 10px);display:flex;flex-direction:column;gap:14px}
.header{display:flex;align-items:center;gap:14px;flex:none}
.logo{width:66px;height:66px;border-radius:20px;background:linear-gradient(145deg,#5ab8ff,#0a6ae4);display:grid;place-items:center;box-shadow:0 10px 22px rgba(21,124,243,.23);color:#fff;font-size:54px;font-weight:800;line-height:1}
.brand{flex:1;min-width:0}.brand h1{margin:0;font-size:34px;letter-spacing:-1px;line-height:1.05}.brand p{margin:6px 0 0;color:#7f8ba1;font-size:17px}
.chips{display:flex;gap:10px}
.chip{min-width:170px;height:66px;border-radius:22px;padding:10px 16px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
.chip.warn{background:var(--orangeSoft);border-color:#f1dfc7;color:var(--orange)}
.chip strong{display:block;font-size:15px;white-space:nowrap}.chip small{display:block;font-size:13px;color:inherit;opacity:.92;margin-top:4px}
.chip .ico{width:28px;height:28px;display:grid;place-items:center;flex:none}
.card{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:28px}
.summary{display:flex;align-items:center;padding:20px 22px;gap:18px;flex:none}
.summary .bag{width:74px;height:74px;border-radius:22px;background:#eff5ff;display:grid;place-items:center;color:var(--blue)}
.summary .main strong{display:block;color:#7c889e;font-size:20px;font-weight:700}.summary .main .amt{font-size:58px;line-height:1.05;letter-spacing:-2px;font-weight:800;margin-top:2px}
.summary .meta{margin-left:auto;border-left:1px solid var(--line);padding-left:24px;color:#7f8ba1;font-size:18px;font-weight:600;display:flex;align-items:center;gap:18px}
.workspace{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px}
.person-card{padding:18px 18px 14px;flex:none}
.person-top{display:flex;align-items:center;gap:18px}.avatar{width:88px;height:88px;border-radius:50%;background:#d9f8e5;display:grid;place-items:center;color:#159761;font-size:28px;font-weight:800;flex:none}
.person-info{flex:1;min-width:0}.person-info h2{margin:0;font-size:28px;letter-spacing:-.5px}.person-meta{display:flex;align-items:center;gap:10px;color:#7d889f;font-size:17px;margin-top:8px}.person-meta .iconbtn-inline{margin-left:6px}
.mini-balance{width:320px;max-width:40%;background:#f0f7ff;border:1px solid #d8e9ff;border-radius:18px;padding:16px 20px;align-self:stretch;display:flex;flex-direction:column;justify-content:center}
.mini-balance strong{font-size:18px;color:#7e8ba0;font-weight:700}.mini-balance .amt{font-size:30px;color:#157cf3;font-weight:800;letter-spacing:-1px;margin-top:6px}
.segment{display:grid;grid-template-columns:1fr 1fr;gap:0;background:#f4f7fc;border:1px solid var(--line);border-radius:22px;overflow:hidden;margin-top:18px}
.segment button{height:64px;font-size:20px;font-weight:700;color:#7e8ba0;display:flex;align-items:center;justify-content:center;gap:12px}
.segment button.active{background:linear-gradient(145deg,#35a0ff,#1475ea);color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.06)}
.section{padding:0;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.section-head{display:flex;align-items:center;gap:14px;padding:18px 18px 12px;flex:none}.section-head h3{margin:0;font-size:28px;letter-spacing:-.7px}.section-head .right{margin-left:auto;color:#7f8ba1;font-size:18px;font-weight:700}
.table-wrap{margin:0 12px 12px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;display:flex;flex-direction:column;flex:1;min-height:0}
.table-head,.row{display:grid;grid-template-columns:1.15fr .9fr 1.25fr .9fr 1.25fr;align-items:center}
.table-head{background:#f5f8fe;color:#7d879b;font-size:14px;font-weight:800;padding:14px 14px;border-bottom:1px solid var(--line)}
.table-body{overflow:auto;flex:1;min-height:0}.row{min-height:70px;padding:0 14px;border-bottom:1px solid var(--line2);font-size:18px}.row:last-child{border-bottom:none}.cell-id{font-weight:500;color:#273753}.cell-money{font-weight:800}.cell-note{color:#2d3647}.cell-date{color:#6f7e97}
.actions{display:flex;gap:10px;justify-content:flex-start;flex-wrap:nowrap}
.act{height:42px;border-radius:14px;padding:0 14px;border:1px solid var(--line);display:inline-flex;align-items:center;gap:8px;font-size:16px;font-weight:700;white-space:nowrap}
.act.blue{background:var(--blueSoft);border-color:#d9e9ff;color:#1b7af1}.act.green{background:var(--greenSoft);border-color:#d4efe2;color:var(--green)}.act.red{background:var(--redSoft);border-color:#f5dbe0;color:var(--red)}
.composer{padding:16px 18px;display:flex;flex-direction:column;gap:16px;flex:none}
.composer-head{display:flex;align-items:center;gap:14px}.plusball{width:50px;height:50px;border-radius:50%;background:linear-gradient(145deg,#2f98ff,#0f73ea);display:grid;place-items:center;color:#fff;flex:none}.composer-head h4{margin:0;font-size:26px;letter-spacing:-.5px}.composer-head .hint{margin-left:auto;color:#7f8ba1;font-size:16px;display:flex;align-items:center;gap:8px}
.entry{display:grid;grid-template-columns:1fr 1.5fr 150px;gap:14px}.field{height:62px;border:1px solid #d7e0ee;border-radius:18px;background:#fff;display:flex;align-items:center;gap:12px;padding:0 16px}.field input{border:none;outline:none;width:100%;font-size:18px;background:transparent}.field input::placeholder{color:#9aa7bc}.submit{height:62px;border-radius:18px;background:linear-gradient(145deg,#2e97ff,#0f73ea);color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;font-size:18px;font-weight:800;box-shadow:0 6px 16px rgba(21,124,243,.18)}
.nav{height:90px;display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-radius:24px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;flex:none}.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#7f8ba1;font-size:16px;font-weight:700}.nav button.active{color:#157cf3;background:#eef5ff}.iconbtn-inline{width:28px;height:28px;display:grid;place-items:center;color:#7e8ba0}
svg{display:block}
.modal-backdrop{position:fixed;inset:0;background:rgba(13,22,42,.28);display:flex;align-items:flex-end;justify-content:center;padding:12px;z-index:50}
.modal-backdrop.hidden{display:none}.sheet{width:min(900px,100%);background:#fff;border-radius:28px 28px 24px 24px;border:1px solid var(--line);box-shadow:0 18px 45px rgba(9,27,52,.24);max-height:82dvh;display:flex;flex-direction:column;overflow:hidden}
.sheet-head{padding:22px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex:none}.sheet-head h3{margin:0;font-size:28px;letter-spacing:-.7px}.sheet-body{padding:18px;overflow:auto;display:flex;flex-direction:column;gap:18px}.notice{padding:18px 20px;background:#f3f7ff;border:1px solid #e0e8f7;border-radius:20px;color:#586b87;font-size:17px;line-height:1.55}.histbox{border:1px solid var(--line);border-radius:20px;overflow:hidden}.hist-head,.hist-row{display:grid;grid-template-columns:1.2fr .9fr 1fr .9fr 1.2fr;align-items:center}.hist-head{background:#f6fbf7;color:#7d879b;font-size:14px;font-weight:800;padding:14px}.hist-row{min-height:72px;padding:0 14px;border-top:1px solid var(--line2);font-size:18px;background:#fbfffc}.hist-row:first-of-type{border-top:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 110px);background:#24374f;color:#fff;padding:14px 22px;border-radius:18px;font-size:16px;box-shadow:0 8px 24px rgba(36,55,79,.28);z-index:80}.toast.hidden{display:none}
.home-hidden{display:none}.date-mobile{display:none}
@media (max-width: 900px){
  .app{padding:12px 10px calc(env(safe-area-inset-bottom) + 8px);gap:10px}
  .logo{width:58px;height:58px;font-size:48px}.brand h1{font-size:28px}.brand p{font-size:15px}
  .chip{min-width:0;width:160px;height:58px;border-radius:20px;padding:8px 12px}.chip strong{font-size:14px}.chip small{font-size:12px}
  .summary{padding:14px 16px;border-radius:24px}.summary .bag{width:60px;height:60px;border-radius:18px}.summary .main strong{font-size:16px}.summary .main .amt{font-size:34px}.summary .meta{font-size:14px;padding-left:16px;gap:10px}
  .person-card{padding:14px 14px 12px;border-radius:24px}.avatar{width:72px;height:72px;font-size:24px}.person-info h2{font-size:22px}.person-meta{font-size:15px}.mini-balance{padding:12px 14px;border-radius:16px}.mini-balance strong{font-size:15px}.mini-balance .amt{font-size:22px}
  .segment button{height:54px;font-size:16px}
  .section-head{padding:14px 14px 10px}.section-head h3{font-size:22px}.section-head .right{font-size:15px}
  .table-head{font-size:12px;padding:10px}.row{font-size:14px;min-height:58px;padding:0 10px}.table-head,.row{grid-template-columns:1.05fr .8fr 1.15fr .85fr 1.2fr}
  .act{height:38px;border-radius:12px;padding:0 10px;font-size:13px}.actions{gap:8px}
  .composer{padding:14px}.composer-head h4{font-size:22px}.composer-head .hint{font-size:14px}.entry{grid-template-columns:1fr 1.4fr 120px;gap:10px}.field,.submit{height:54px}.field input{font-size:16px}.submit{font-size:16px}
  .nav{height:78px;border-radius:22px}.nav button{font-size:14px;gap:6px}
  .sheet-head h3{font-size:22px}.sheet-body{padding:14px}.notice{font-size:15px;padding:14px 16px}.hist-head{font-size:12px}.hist-row{font-size:14px;min-height:62px}
}
@media (max-width: 680px){
  .header{gap:10px}.chips{gap:8px}.chip{width:145px}.chip .copy{min-width:0}
  .summary .main .amt{font-size:30px}.summary .meta{font-size:13px}
  .mini-balance{max-width:44%}
  .table-head,.row{grid-template-columns:1.05fr .8fr 1.0fr .75fr 1.15fr}
  .cell-note{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .actions{gap:6px}.act{padding:0 8px;font-size:12px}.act span{display:none}.act svg{margin:0}
}

/* Bố cục điện thoại: không cho header, thẻ người nợ và bảng ép nhau tràn màn hình */

  .header{display:grid;grid-template-columns:42px minmax(62px,1fr) minmax(75px,92px) minmax(82px,97px);gap:5px;min-width:0;min-height:45px;max-height:48px}

  .workspace{min-height:0;flex:1;gap:7px}
  .person-card{padding:9px 9px 8px;flex:none;border-radius:16px}
  .person-top{display:grid;grid-template-columns:38px minmax(0,1fr) minmax(92px,112px);gap:8px;align-items:center}

  .actions{gap:3px;overflow:visible!important;justify-content:flex-end;min-width:0}

@media (max-width:350px){
  .app{gap:5px;padding-left:5px;padding-right:5px}
  .header{grid-template-columns:36px minmax(48px,1fr) 74px 80px;gap:3px}

/* Các thành phần mới sử dụng lại toàn bộ màu, font, icon, bảng của bản giao diện đã duyệt. */
.chip.ok{background:#effbf5;color:#18865b;border-color:#d3eadc}
.top-add{margin-left:auto;display:flex;align-items:center;gap:7px;background:linear-gradient(145deg,#2d97ff,#1271e6);color:#fff;font-size:15px;font-weight:750;border-radius:13px;padding:8px 11px;white-space:nowrap}
.top-add svg{width:17px;height:17px}
.home-card{display:flex;flex:1;min-height:0;flex-direction:column}
.home-list{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}

function uid(prefix){const a=new Uint8Array(6);if(crypto?.getRandomValues)crypto.getRandomValues(a);else for(let i=0;i<a.length;i++)a[i]=Math.floor(Math.random()*256);return prefix+'-'+Array.from(a,v=>v.toString(16).padStart(2,'0')).join('').toUpperCase()}

function parseAmounts(raw){const tokens=String(raw||'').trim().split(/[\s;]+/).filter(Boolean);if(!tokens.length||tokens.length>30)throw Error('Nhập từ 1 đến 30 số tiền');return tokens.map(t=>{let s=t.toLowerCase().replace(/₫|vnd/g,'').trim(),mult=1;if(/(triệu|tr|m)$/.test(s)){mult=1e6;s=s.replace(/(triệu|tr|m)$/,'')}else if(/(nghìn|ngàn|k)$/.test(s)){mult=1e3;s=s.replace(/(nghìn|ngàn|k)$/,'')}if(!/^\d+(?:[.,]\d+)*$/.test(s))throw Error('Số tiền không hợp lệ');s=s.replace(/\./g,'').replace(',','.');let n=Number(s);if(mult===1&&n<1000)mult=1000;n=Math.round(n*mult);if(!Number.isSafeInteger(n)||n<1||n>1e12)throw Error('Số tiền phải từ 1đ đến 1.000 tỷ đồng');return n})}

 <section class="section card"><div class="section-head"><span id="docIcon">${icons.doc}</span><h3>Danh sách mã nợ</h3><div class="right">${ds.length} khoản • ${money(personTotal(p.id))}</div><div class="head-tools"><button type="button" class="head-icon" data-expand-table aria-label="${expanded?'Thu nhỏ bảng':'Mở rộng bảng'}" title="${expanded?'Thu nhỏ bảng':'Mở rộng bảng'}">${expanded?icons.minimize:icons.maximize}</button></div></div><div class="table-wrap"><div class="table-head"><div>Mã nợ</div><div>Số tiền</div><div>Ghi chú</div><div>Ngày</div><div>Thao tác</div></div><div class="table-body" id="debtRows">${ds.length?ds.map(debtRow).join(''):'<div class="empty">Chưa có mã nợ chưa thu.</div>'}</div></div></section>
 <section class="composer card"><div class="composer-head"><div class="plusball">${icons.plus}</div><h4 id="composerTitle">${editing?'Sửa khoản nợ':'Thêm khoản nợ'}</h4><div class="hint">${icons.info}Enter 2 lần để lưu nhanh</div></div><form class="entry" id="debtForm"><div class="field">${icons.moneyInput}<input id="amountInput" placeholder="Số tiền (đ)" inputmode="decimal" autocomplete="off" required></div><div class="field">${icons.note}<input id="noteInput" placeholder="Ghi chú (ví dụ: Tiền ăn trưa)" maxlength="240" autocomplete="off"></div><button class="submit" id="saveDebtBtn" type="submit">${editing?icons.check:icons.plus}${editing?'Lưu':'Thêm'}</button></form></section>`;
 if(editing){const d=state.debts.find(d=>d.id===editing);if(d){$('amountInput').value=String(d.amount);$('noteInput').value=d.note||''}}
}
function resetComposer(){editing=null;expanded=false;render();$('amountInput')?.focus()}
function saveDebt(){if(!selected||!person(selected))return;const vals=parseAmounts($('amountInput').value),note=$('noteInput').value.trim();if(editing){if(vals.length!==1)throw Error('Sửa mỗi lần một mã nợ');const d=state.debts.find(x=>x.id===editing&&!x.deletedAt&&x.status==='open'&&x.personId===selected);if(!d)throw Error('Mã nợ đã thay đổi');d.amount=vals[0];d.note=note;d.updatedAt=now();toast('Đã sửa mã nợ')}else{const t=Date.now();for(let i=0;i<vals.length;i++)state.debts.push({id:uid('N'),personId:selected,amount:vals[i],note,status:'open',createdAt:new Date(t+i).toISOString(),updatedAt:now(),paidAt:null,deletedAt:null});toast('Đã ghi '+vals.length+' mã nợ')}changed();resetComposer()}
function stamp(d,changes){Object.assign(d,changes,{updatedAt:now()});changed();render()}
function payDebt(id){const d=state.debts.find(d=>d.id===id&&!d.deletedAt&&d.personId===selected&&d.status==='open');if(!d)return;if(!confirm(`Xác nhận đã thu đủ ${money(d.amount)} của mã ${d.id}?`))return;stamp(d,{status:'paid',paidAt:new Date().toISOString()});toast('Đã chuyển vào lịch sử của '+person(selected).name)}
function deleteDebt(id){const d=state.debts.find(d=>d.id===id&&!d.deletedAt&&d.personId===selected&&d.status==='open');if(!d)return;if(!confirm(`Xoá khoản nợ ${d.id} (${money(d.amount)})?`))return;stamp(d,{deletedAt:new Date().toISOString()});toast('Đã xoá mã nợ')}
function deletePerson(id){const p=person(id);if(!p)return;if(!confirm(`Xoá người nợ ${p.name} và toàn bộ mã nợ, lịch sử của họ?`))return;const time=new Date().toISOString();p.deletedAt=time;p.updatedAt=now();state.debts.filter(d=>d.personId===id&&!d.deletedAt).forEach(d=>{d.deletedAt=time;d.updatedAt=now()});if(selected===id){selected=null;editing=null;view='home'}changed();render();toast('Đã xoá người nợ')}
function showSheet(title,html,kind='other'){sheet=kind;const overlay=$('overlay');$('sheetTitle').textContent=title;$('sheetBody').innerHTML=html;overlay.classList.remove('hidden');$('closeSheet').innerHTML=icons.close}
function closeSheet(){sheet=null;$('overlay').classList.add('hidden');if(view==='detail')$('amountInput')?.blur()}
function openHistory(){const p=person(selected);if(!p){toast('Chọn người nợ để xem lịch sử');return}const a=paidDebts(p.id).slice().sort((x,y)=>Date.parse(y.paidAt||y.createdAt)-Date.parse(x.paidAt||x.createdAt));showSheet('Lịch sử của '+p.name,`<div class="notice">Chỉ hiển thị khoản đã thu của <b>${esc(p.name)}</b>. Hoàn tác trả về danh sách nợ. Xoá lịch sử sẽ xoá mã đó.</div><div class="histbox"><div class="hist-head"><div>Mã nợ</div><div>Số tiền</div><div>Ghi chú</div><div>Ngày thu</div><div>Thao tác</div></div>${a.length?a.map(d=>`<div class="hist-row"><div class="cell-id" title="${esc(d.id)}"><span class="id-full">${esc(d.id)}</span><span class="id-short">${esc(displayId(d.id))}</span></div><div class="cell-money">${money(d.amount)}</div><div class="cell-note">${esc(d.note||'—')}</div><div class="cell-date" title="${dateTime(d.paidAt||d.createdAt)}">${fullDateHtml(d.paidAt||d.createdAt)}</div><div class="actions">${action('undo-debt',d,'Hoàn tác','blue',icons.undo)}${action('delete-paid',d,'Xoá','red',icons.trash)}</div></div>`).join(''):'<div class="empty">Chưa có khoản đã trả.</div>'}</div>`,'history')}
function doUndo(id){const d=state.debts.find(d=>d.id===id&&!d.deletedAt&&d.personId===selected&&d.status==='paid');if(!d)return;stamp(d,{status:'open',paidAt:null});openHistory();toast('Đã hoàn tác, mã trở lại danh sách chưa thu')}
function deletePaid(id){const d=state.debts.find(d=>d.id===id&&!d.deletedAt&&d.personId===selected&&d.status==='paid');if(!d)return;if(!confirm(`Xoá vĩnh viễn mã đã trả ${d.id}?`))return;stamp(d,{deletedAt:new Date().toISOString()});openHistory();toast('Đã xoá lịch sử')}
function openPersonForm(p=null){showSheet(p?'Sửa người nợ':'Thêm người nợ',`<form id="personForm" class="sheet-form"><label>Tên người nợ<input class="setting-input" id="personNameField" maxlength="80" value="${esc(p?.name||'')}" placeholder="Nhập tên" required autocomplete="off"></label><label>Số điện thoại (không bắt buộc)<input class="setting-input" id="personPhoneField" type="tel" maxlength="25" value="${esc(p?.phone||'')}" placeholder="Số điện thoại"></label><div class="sheet-actions"><button class="sheet-btn light" type="button" data-close>Huỷ</button><button class="sheet-btn primary" type="submit">${p?'Lưu thay đổi':'Thêm người nợ'}</button></div></form>`,p?'edit-person':'new-person');sheetContext=p?.id||null;$('personNameField').focus()}
function submitPerson(){const name=$('personNameField').value.trim(),phone=$('personPhoneField').value.trim();if(!name)throw Error('Nhập tên người nợ');if(sheet==='edit-person'){const p=person(sheetContext);if(!p)throw Error('Người nợ không tồn tại');Object.assign(p,{name,phone,updatedAt:now()});toast('Đã cập nhật người nợ')}else{const p={id:uid('P'),name,phone,createdAt:new Date().toISOString(),updatedAt:now(),deletedAt:null};state.people.push(p);selected=p.id;view='detail';toast('Đã thêm người nợ')}changed();closeSheet();render()}
function backup(){const data={format:'sono-backup',version:4,exportedAt:new Date().toISOString(),state};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='SoNo-Backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('Đã tạo bản sao lưu JSON')}
function openBackup(){showSheet('Sao lưu & khôi phục',`${settingBack}<div class="notice">Dữ liệu công nợ lưu trên điện thoại. Xuất JSON định kỳ để giữ bản dự phòng; khôi phục sẽ thay thế toàn bộ dữ liệu hiện tại sau khi xác nhận.</div><div class="sheet-actions"><button class="sheet-btn primary" data-export>${icons.upload} Xuất bản sao lưu</button><button class="sheet-btn light" data-import>Khôi phục từ JSON</button></div><p class="subtle">Đồng bộ sẽ được tích hợp khi phát hành ứng dụng có cấu hình Firebase cố định.</p>`,'backup')}
function validateBackup(obj){const s=obj?.format==='sono-backup'?obj.state:obj;if(!s||!Array.isArray(s.people)||!Array.isArray(s.debts))throw Error('Không phải bản sao lưu Sổ Nợ');if(s.people.length>100000||s.debts.length>1000000)throw Error('Bản sao lưu quá lớn');const ids=new Set();for(const p of s.people){if(typeof p.id!=='string'||typeof p.name!=='string'||ids.has(p.id))throw Error('Dữ liệu người nợ không hợp lệ');ids.add(p.id)}const dids=new Set();for(const d of s.debts){if(typeof d.id!=='string'||dids.has(d.id)||!ids.has(d.personId)||!Number.isSafeInteger(d.amount)||d.amount<1||!['open','paid'].includes(d.status))throw Error('Dữ liệu mã nợ không hợp lệ');dids.add(d.id)}return {version:4,ownerUid:state.ownerUid,demo:false,people:s.people.map(p=>({...p,updatedAt:p.updatedAt||now(),deletedAt:p.deletedAt||null})),debts:s.debts.map(d=>({...d,updatedAt:d.updatedAt||now(),deletedAt:d.deletedAt||null}))}}
async function restore(file){if(!file)return;const text=await file.text();if(text.length>60e6)throw Error('Tệp quá lớn');const next=validateBackup(JSON.parse(text));if(!confirm('Khôi phục sẽ THAY THẾ toàn bộ dữ liệu công nợ hiện tại. Mày đã sao lưu chưa?'))return;if(account)throw Error('Đăng xuất Firebase trước khi thay thế dữ liệu, tránh đồng bộ nhầm.');state=next;selected=people()[0]?.id||null;view='home';editing=null;persist();closeSheet();render();toast('Đã khôi phục dữ liệu')}
function settings(){showSheet('Cài đặt',`<div class="settings-menu" role="group" aria-label="Danh mục cài đặt">
 <button type="button" class="setting-item" data-settings-account><span class="setting-item-icon">${icons.google}</span><span class="setting-item-text"><strong>Tài khoản & đăng nhập</strong><small>Đăng nhập Google · ${account?'Đã đăng nhập':'Chưa kết nối'}</small></span>${icons.chevron}</button>
 <button type="button" class="setting-item" data-settings-backup><span class="setting-item-icon">${icons.upload}</span><span class="setting-item-text"><strong>Sao lưu & khôi phục</strong><small>Xuất hoặc nhập bản sao lưu JSON</small></span>${icons.chevron}</button>
 <button type="button" class="setting-item" data-settings-firebase><span class="setting-item-icon">${icons.cloud}</span><span class="setting-item-text"><strong>Firebase & đồng bộ</strong><small>Thiết lập cố định khi đóng gói ứng dụng</small></span>${icons.chevron}</button>
 <button type="button" class="setting-item" data-settings-data><span class="setting-item-icon">${icons.settings}</span><span class="setting-item-text"><strong>Dữ liệu sổ nợ</strong><small>Quản lý dữ liệu mẫu và dữ liệu trên máy</small></span>${icons.chevron}</button></div>`,'settings')}
const settingBack=`<button class="settings-back" type="button" data-settings-home>${icons.chevron} Cài đặt</button>`;
function accountSettings(){showSheet('Tài khoản & đăng nhập',`${settingBack}<div class="notice">Đăng nhập Google sẽ được kích hoạt khi phiên bản ứng dụng tích hợp Firebase cố định. Bản HTML hiện tại lưu công nợ trên thiết bị, chưa đăng nhập hoặc đồng bộ tài khoản.</div><div class="settings-status">Trạng thái: ${account?'Đã kết nối Google':'Chưa kết nối'}</div>`,'account')}
function firebaseSettings(){showSheet('Firebase & đồng bộ',`${settingBack}<div class="notice">Firebase sẽ được cấu hình cố định trong phiên bản ứng dụng sau. Không cần nhập API key, Project ID hoặc thông số Firebase vào bản HTML này.</div><div class="settings-status">Đồng bộ trực tuyến: Chưa kích hoạt. Tiếp tục sử dụng và sao lưu dữ liệu offline trong mục Sao lưu & khôi phục.</div>`,'firebase-info')}
function dataSettings(){showSheet('Dữ liệu sổ nợ',`${settingBack}<div class="notice">Xoá dữ liệu trên thiết bị sẽ không thể hoàn tác nếu chưa sao lưu. Nên xuất JSON trước khi xoá.</div><div class="sheet-actions"><button class="sheet-btn light" data-settings-backup type="button">${icons.upload} Sao lưu dữ liệu</button><button class="sheet-btn light" type="button" data-clear-sample>${state.demo?'Xoá dữ liệu mẫu để bắt đầu sổ trống':'Xoá toàn bộ dữ liệu trên máy'}</button></div>`,'data-settings')}
const RULES=`rules_version = '2';\nservice cloud.firestore {\n match /databases/{database}/documents {\n  match /sono_users/{userId}/{kind}/{itemId} {\n   allow read, write: if request.auth != null && request.auth.uid == userId && kind in ['people', 'debts'];\n  }\n }\n}`;
function queueSync(){if(!account||!fbDb||state.demo)return;syncStatus=navigator.onLine?'Đang chờ đồng bộ':'Offline · chờ kết nối';renderHeader();clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow().catch(e=>{syncStatus='Lỗi: '+(e.code||e.message);renderHeader()}),900)}
async function initFirebase(){if(fb)return;if(!cfg.apiKey||!cfg.projectId||!cfg.authDomain||!cfg.appId)throw Error('Nhập đủ cấu hình Firebase trong Cài đặt');if(location.protocol!=='https:'&&location.hostname!=='localhost')throw Error('Đăng nhập Google cần mở trang trên HTTPS, không dùng file:// hoặc trang raw');const [app,auth,firestore]=await Promise.all([import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js'),import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js'),import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js')]);fb={app,auth,firestore};fbApp=app.initializeApp(cfg);fbAuth=auth.getAuth(fbApp);fbDb=firestore.getFirestore(fbApp);await auth.setPersistence(fbAuth,auth.browserLocalPersistence);auth.onAuthStateChanged(fbAuth,u=>{if(!u){account=null;syncStatus='Chưa đăng nhập';renderHeader();return}if(state.ownerUid&&state.ownerUid!==u.uid){account=null;syncStatus='Tài khoản không khớp';toast('Dữ liệu gắn với Google khác. Hãy sao lưu trước khi đổi tài khoản.');auth.signOut(fbAuth);return}state.ownerUid=u.uid;persist();account=u;syncStatus='Đang kết nối';renderHeader();syncNow().catch(e=>{syncStatus='Lỗi: '+(e.code||e.message);renderHeader();toast('Không đồng bộ được: '+e.message)})})}
async function googleLogin(){if(!cfg.apiKey||!cfg.projectId||!cfg.authDomain||!cfg.appId){settings();toast('Điền đủ cấu hình Firebase trước');return}try{await initFirebase();if(account){settings();return}const provider=new fb.auth.GoogleAuthProvider();await fb.auth.signInWithPopup(fbAuth,provider)}catch(e){toast('Đăng nhập Google: '+(e.code||e.message))}}
async function syncNow(){if(!account||!fbDb)throw Error('Chưa đăng nhập Firebase');if(state.demo)throw Error('Xoá dữ liệu mẫu trước khi đồng bộ thật');if(!navigator.onLine){syncStatus='Offline · chờ kết nối';renderHeader();return}if(syncBusy){syncQueued=true;return}syncBusy=true;syncStatus='Đang đồng bộ';renderHeader();try{const fs=fb.firestore;const root=['sono_users',account.uid];for(const [kind,items] of [['people',state.people],['debts',state.debts]]){
 const col=fs.collection(fbDb,...root,kind);const remote=await fs.getDocs(col);const map=new Map(items.map(o=>[o.id,o]));const push=[];remote.forEach(doc=>{const r=doc.data();if(!r||typeof r.id!=='string')return;const local=map.get(r.id);if(!local){if(kind==='people')state.people.push(r);else state.debts.push(r);map.set(r.id,r)}else if((Number(r.updatedAt)||0)>(Number(local.updatedAt)||0)){Object.assign(local,r)}else if((Number(local.updatedAt)||0)>(Number(r.updatedAt)||0)){push.push(local)}});for(const local of items){if(!remote.docs.some(d=>d.id===local.id))push.push(local)}for(let i=0;i<push.length;i+=100){const batch=fs.writeBatch(fbDb);push.slice(i,i+100).forEach(r=>batch.set(fs.doc(fbDb,...root,kind,r.id),r));await batch.commit()}}
 persist();render();syncStatus='Đã đồng bộ';renderHeader();}finally{syncBusy=false;if(syncQueued){syncQueued=false;queueSync()}}}
function clearAll(){if(!confirm('Xoá dữ liệu mẫu/toàn bộ dữ liệu trên máy? Không thể hoàn tác nếu chưa sao lưu.'))return;if(account){toast('Đăng xuất Firebase trước khi xoá dữ liệu trên máy');return}state={version:4,ownerUid:null,demo:false,people:[],debts:[]};selected=null;editing=null;view='home';persist();closeSheet();render();toast('Sổ nợ đã trống')}
function clickAction(el){const copyId=el.closest('[data-copy-debt-id]');if(copyId){const id=copyId.dataset.copyDebtId;const fallback=()=>window.prompt('Mã nợ đầy đủ (có thể sao chép):',id);if(navigator.clipboard?.writeText)return navigator.clipboard.writeText(id).then(()=>toast('Đã sao chép mã '+id)).catch(fallback);return fallback()}if(el.closest('[data-close]'))return closeSheet();if(el.closest('[data-settings-home]'))return settings();if(el.closest('[data-settings-account]'))return accountSettings();if(el.closest('[data-settings-backup]'))return openBackup();if(el.closest('[data-settings-firebase]'))return firebaseSettings();if(el.closest('[data-settings-data]'))return dataSettings();if(el.closest('[data-back]')){view='home';expanded=false;editing=null;return render()}if(el.closest('[data-new-person]'))return openPersonForm();if(el.closest('[data-edit-person]'))return openPersonForm(person(selected));const id=el.closest('[data-remove-person]')?.dataset.removePerson;if(id)return deletePerson(id);const node=el.closest('[data-person]');if(node){selected=node.dataset.person;view='detail';expanded=false;editing=null;return render()}if(el.closest('[data-open-history]'))return openHistory();if(el.closest('[data-expand-table]')){expanded=!expanded;return render()}const edit=el.closest('[data-edit-debt]');if(edit){const d=state.debts.find(d=>d.id===edit.dataset.editDebt&&!d.deletedAt&&d.status==='open');if(d){editing=d.id;expanded=false;render();$('amountInput').focus()}return}const pay=el.closest('[data-pay-debt]');if(pay)return payDebt(pay.dataset.payDebt);const del=el.closest('[data-delete-debt]');if(del)return deleteDebt(del.dataset.deleteDebt);const undo=el.closest('[data-undo-debt]');if(undo)return doUndo(undo.dataset.undoDebt);const delPaid=el.closest('[data-delete-paid]');if(delPaid)return deletePaid(delPaid.dataset.deletePaid);
 if(el.closest('[data-export]'))return backup();if(el.closest('[data-import]'))return $('fileImport').click();if(el.closest('[data-connect]')||el.closest('[data-sync]'))return firebaseSettings();if(el.closest('[data-logout]'))return fbAuth?fb.auth.signOut(fbAuth).then(()=>toast('Đã đăng xuất')):toast('Chưa đăng nhập');if(el.closest('[data-copy-rules]'))return navigator.clipboard?.writeText(RULES).then(()=>toast('Đã chép quy tắc bảo mật')).catch(()=>toast('Trình duyệt không cho phép sao chép'));if(el.closest('[data-clear-sample]'))return clearAll();}
function bind(){document.addEventListener('click',e=>{const b=e.target.closest('button,[data-person]');if(!b)return;if(b.id==='closeSheet')return closeSheet();if(b.id==='settingsBtn')return settings();Promise.resolve().then(()=>clickAction(b)).catch(e=>toast(e.message))});document.addEventListener('submit',e=>{if(e.target.id==='debtForm'){e.preventDefault();try{saveDebt()}catch(x){toast(x.message);$('amountInput').focus()}}else if(e.target.id==='personForm'){e.preventDefault();try{submitPerson()}catch(x){toast(x.message)}}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet)return closeSheet();if(e.key==='Escape'&&expanded){expanded=false;render();return}if(e.key==='Enter'&&e.target.id==='amountInput'){e.preventDefault();$('noteInput').focus()}else if(e.key==='Enter'&&e.target.id==='noteInput'){e.preventDefault();try{saveDebt()}catch(x){toast(x.message);$('amountInput').focus()}}else if((e.key==='Enter'||e.key===' ')&&e.target.classList?.contains('home-person')){e.preventDefault();selected=e.target.dataset.person;view='detail';render()}});$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeSheet()});$('fileImport').addEventListener('change',async e=>{try{await restore(e.target.files[0])}catch(x){toast('Khôi phục: '+x.message)}finally{e.target.value=''}});window.addEventListener('online',()=>{if(account)queueSync()});window.addEventListener('beforeunload',persist);}
$('settingsBtn').innerHTML=icons.settings;$('bagIcon').innerHTML=icons.bag;$('chevIcon').innerHTML=icons.chevron;
bind();render();persist();
})();

</script>
